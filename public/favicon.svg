<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded-square ink background, matching the app's ink token -->
  <rect width="64" height="64" rx="14" fill="#0B0F1F"/>

  <!-- The "route" mark: a guided path curving up to a destination node.
       This is a distilled version of the hero section's animated route
       line (Discover -> Apply -> Grow -> Lead), reduced to something
       legible at 16px: a path plus one bright destination dot. -->
  <path
    d="M 14 44 C 20 44, 24 34, 30 30 S 40 20, 46 16"
    fill="none"
    stroke="#FFB627"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- small waypoint along the path -->
  <circle cx="28" cy="32" r="2.6" fill="#6C5CE7"/>

  <!-- destination node, larger + brightest -->
  <circle cx="46" cy="16" r="5.5" fill="#FFB627"/>
</svg>
