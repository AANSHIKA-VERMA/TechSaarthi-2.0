<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ============================== Core SEO ============================== -->
    <title>TechSaarthi — Internships, Scholarships & Hackathons for Women in Tech</title>
    <meta
      name="description"
      content="TechSaarthi helps women BTech students discover internships, scholarships, hackathons, and leadership programs in tech — all in one place, with an AI mentor built in."
    />
    <meta
      name="keywords"
      content="internships for women in tech, scholarships for women engineers, hackathons India, women in tech opportunities, BTech internships, tech scholarships for women, women in STEM"
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="TechSaarthi" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0F1F" />

    <!-- Replace with your real production domain once you have one -->
    <link rel="canonical" href="https://techsaarthi.vercel.app/" />

    <!-- ============================ Open Graph ============================== -->
    <!-- Controls how the link looks when shared on WhatsApp, LinkedIn, Facebook,
         Slack, Discord, etc. — this is the single biggest lever for "other
         students finding it" when a link gets forwarded around. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TechSaarthi" />
    <meta property="og:url" content="https://techsaarthi.vercel.app/" />
    <meta property="og:title" content="TechSaarthi — Internships, Scholarships & Hackathons for Women in Tech" />
    <meta
      property="og:description"
      content="Discover internships, scholarships, hackathons, and leadership programs curated for women in tech — with an AI mentor to help you find your path."
    />
    <meta property="og:image" content="https://techsaarthi.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- ============================ Twitter Card ============================= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TechSaarthi — Internships, Scholarships & Hackathons for Women in Tech" />
    <meta
      name="twitter:description"
      content="Discover internships, scholarships, hackathons, and leadership programs curated for women in tech — with an AI mentor to help you find your path."
    />
    <meta name="twitter:image" content="https://techsaarthi.vercel.app/og-image.png" />

    <!-- ============================== Icons ================================== -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ============================== Fonts =================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- ======================= Structured data (JSON-LD) ===================== -->
    <!-- Helps Google understand what this site is, independent of page text.
         Doesn't guarantee a rich result, but it's a well-supported signal. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TechSaarthi",
        "url": "https://techsaarthi.vercel.app/",
        "description": "TechSaarthi helps women BTech students discover internships, scholarships, hackathons, and leadership programs in tech, with an AI mentor built in.",
        "inLanguage": "en"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
